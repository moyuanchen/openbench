[project]
name = "lab"
version = "0.1.0"
description = "Serve models on Modal and wire them into OpenCode"
requires-python = ">=3.12"
dependencies = ["modal==1.5.5"]

[project.scripts]
lab = "lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lab", "serving"]
