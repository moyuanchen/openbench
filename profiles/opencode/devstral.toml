# OpenCode profile "devstral". With OpenCode active (`lab harness opencode`), `lab use devstral` writes it to build/opencode.json and into
# ~/.config/opencode/opencode.json (only the `lab` provider and the keys set here).

model    = "lab/devstral-small-2"        # OpenCode's default model (models.toml: devstral-small-2)
# models = ["devstral-small-2"]          # which models.toml entries OpenCode lists; omit = every deployed one
feedback = true                          # ask for a 1–4 rating after each prompt; `/feedback` in OpenCode toggles it per window

# [opencode]                             # copied as-is into the OpenCode config, for any other OpenCode setting
# small_model = "lab/devstral-small-2"
